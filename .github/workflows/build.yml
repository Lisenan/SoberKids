name: Build keeper board

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC only and does not follow daylight saving.
    # 05:00 and 17:00 UTC = midnight and noon EST (Nov-Mar).
    # During EDT (Sep-early Nov) these land at 1am and 1pm ET.
    # To track EDT instead, use 04:00 and 16:00.
    - cron: 0 5 * * *
    - cron: 0 17 * * *
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install requests
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
